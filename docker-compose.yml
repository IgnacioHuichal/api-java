version: "3.8"

services:
  app:
    build: .
    container_name: miapp-backend
    ports:
      - "8080:8080"
    environment:
      # Config Spring para Mongo
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/miappdb

      # Config ejemplo para RabbitMQ (ajusta a tus properties)
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_PORT: 5672
      SPRING_RABBITMQ_USERNAME: user
      SPRING_RABBITMQ_PASSWORD: password

      # Otras variables que uses (JWT secret, etc.)
      # JWT_SECRET: "cambia-este-valor"
    depends_on:
      - mongo
      - rabbitmq

  mongo:
    image: mongo:7
    container_name: miapp-mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  rabbitmq:
    image: rabbitmq:3-management
    container_name: miapp-rabbitmq
    restart: always
    ports:
      - "5672:5672"   # puerto de mensajes
      - "15672:15672" # consola web de administración
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password

volumes:
  mongo_data:
